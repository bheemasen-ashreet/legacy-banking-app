# SQLite datasource — points to the repo-root legacybank.db
# Path is relative to the working directory when the app is started from modern/backend/
spring.datasource.url=jdbc:sqlite:../../legacybank.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Never let Spring initialise or alter the schema (it already exists)
spring.sql.init.mode=never

# Server
server.port=8080

# Actuator — expose only the health endpoint
management.endpoints.web.exposure.include=health
